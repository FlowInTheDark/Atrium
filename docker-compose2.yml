services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  atrium:
    image: vibralabs/atrium:latest
    # Coolify's proxy reaches this port over the private Docker network.
    # Do not publish host port 8080: Coolify's proxy already uses it.
    expose:
      - "8080"
    environment:
      USE_BUILT_IN_DB: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}
      WEB_URL: ${WEB_URL:-https://mijn.flowminate.io}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health', {signal: AbortSignal.timeout(4000)}).then(async r => { const h = await r.json(); process.exit(r.ok && h.status === 'ok' && h.database === 'connected' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
